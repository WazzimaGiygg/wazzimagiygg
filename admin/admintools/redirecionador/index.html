<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Redirecionamentos - Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 30px 40px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            color: #1f2937;
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header h1 i {
            color: #4f46e5;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background: #b91c1c;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }

        .btn-success:hover {
            background: #15803d;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #d1d5db;
            transform: translateY(-2px);
        }

        .stats-bar {
            background: white;
            border-radius: 15px;
            padding: 20px 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .number {
            font-size: 2rem;
            font-weight: bold;
            color: #4f46e5;
        }

        .stat-item .label {
            color: #6b7280;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .filters {
            background: white;
            border-radius: 15px;
            padding: 20px 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filters input,
        .filters select {
            padding: 10px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.95rem;
            flex: 1;
            min-width: 200px;
            transition: border-color 0.3s;
        }

        .filters input:focus,
        .filters select:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .table-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        thead {
            background: #f9fafb;
        }

        th {
            padding: 15px 12px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
            white-space: nowrap;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #f3f4f6;
            vertical-align: middle;
        }

        tr:hover {
            background: #f9fafb;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-redirected {
            background: #d1fae5;
            color: #065f46;
        }

        .status-cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-confirmed {
            background: #dbeafe;
            color: #1e40af;
        }

        .url-cell {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }

        .url-cell a {
            color: #4f46e5;
            text-decoration: none;
        }

        .url-cell a:hover {
            text-decoration: underline;
        }

        .actions-cell {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 8px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .loading .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.1);
            border-top: 6px solid #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-state i {
            font-size: 4rem;
            color: #d1d5db;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #374151;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1f2937;
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: #16a34a;
        }

        .toast.error {
            background: #dc2626;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding: 15px;
        }

        .pagination button {
            padding: 8px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .pagination button:hover {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        .pagination button.active {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .header {
                padding: 20px;
                flex-direction: column;
                align-items: stretch;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .header-actions {
                flex-direction: column;
            }

            .filters {
                flex-direction: column;
            }

            .filters input,
            .filters select {
                min-width: 100%;
            }

            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }

            .actions-cell {
                flex-direction: column;
            }

            td {
                font-size: 0.8rem;
                padding: 8px;
            }

            th {
                font-size: 0.75rem;
                padding: 8px;
            }
        }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js">
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <i class="fas fa-link"></i>
                Redirecionamentos
            </h1>
            <div class="header-actions">
                <button onclick="refreshData()" class="btn btn-primary">
                    <i class="fas fa-sync"></i> Atualizar
                </button>
                <button onclick="exportCSV()" class="btn btn-success">
                    <i class="fas fa-file-csv"></i> Exportar CSV
                </button>
                <button onclick="clearAll()" class="btn btn-danger">
                    <i class="fas fa-trash"></i> Limpar Tudo
                </button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-bar" id="statsBar">
            <div class="stat-item">
                <div class="number" id="totalCount">0</div>
                <div class="label">Total</div>
            </div>
            <div class="stat-item">
                <div class="number" id="pendingCount">0</div>
                <div class="label">Pendentes</div>
            </div>
            <div class="stat-item">
                <div class="number" id="redirectedCount">0</div>
                <div class="label">Redirecionados</div>
            </div>
            <div class="stat-item">
                <div class="number" id="cancelledCount">0</div>
                <div class="label">Cancelados</div>
            </div>
            <div class="stat-item">
                <div class="number" id="confirmedCount">0</div>
                <div class="label">Confirmados</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <input type="text" id="searchInput" placeholder="🔍 Buscar por URL, domínio ou usuário..." oninput="applyFilters()">
            <select id="statusFilter" onchange="applyFilters()">
                <option value="">Todos os status</option>
                <option value="pending">Pendente</option>
                <option value="redirected">Redirecionado</option>
                <option value="cancelled">Cancelado</option>
                <option value="confirmed">Confirmado</option>
            </select>
            <select id="sortFilter" onchange="applyFilters()">
                <option value="newest">Mais recentes</option>
                <option value="oldest">Mais antigos</option>
            </select>
        </div>

        <!-- Table -->
        <div class="table-container">
            <div id="loadingState" class="loading">
                <div class="spinner"></div>
                <p>Carregando redirecionamentos...</p>
            </div>

            <div id="tableWrapper" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Usuário</th>
                            <th>Domínio</th>
                            <th>URL Destino</th>
                            <th>Status</th>
                            <th>Data/Hora</th>
                            <th>Referrer</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
                <div id="pagination" class="pagination"></div>
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="fas fa-inbox"></i>
                <h3>Nenhum redirecionamento encontrado</h3>
                <p>Os redirecionamentos registrados aparecerão aqui.</p>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <span id="toastMessage">Mensagem</span>
    </div>

    <script>
        // ============================================================
        // CONFIGURAÇÃO DO FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyB9GkSqTIZ0kbVsba_WOdQeVAETrF9qna0",
            authDomain: "wzzm-ce3fc.firebaseapp.com",
            projectId: "wzzm-ce3fc",
            storageBucket: "wzzm-ce3fc.appspot.com",
            messagingSenderId: "249427877153",
            appId: "1:249427877153:web:0e4297294794a5aadeb260",
            measurementId: "G-PLKNZNFCQ8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ============================================================
        // VARIÁVEIS GLOBAIS
        // ============================================================
        let allRedirects = [];
        let filteredRedirects = [];
        let currentPage = 1;
        const itemsPerPage = 20;

        // ============================================================
        // FUNÇÕES PRINCIPAIS
        // ============================================================

        // Carregar dados do Firebase
        async function loadData() {
            const loading = document.getElementById('loadingState');
            const tableWrapper = document.getElementById('tableWrapper');
            const emptyState = document.getElementById('emptyState');

            loading.style.display = 'block';
            tableWrapper.style.display = 'none';
            emptyState.style.display = 'none';

            try {
                // Busca todos os documentos da coleção redirectwarning
                const snapshot = await db.collection('redirectwarning')
                    .orderBy('timestamp', 'desc')
                    .get();

                allRedirects = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    allRedirects.push({
                        id: doc.id,
                        ...data,
                        // Converte timestamp para Date
                        timestamp: data.timestamp ? data.timestamp.toDate() : null,
                        redirectedAt: data.redirectedAt ? data.redirectedAt.toDate() : null
                    });
                });

                console.log(`✅ ${allRedirects.length} redirecionamentos carregados`);

                loading.style.display = 'none';

                if (allRedirects.length === 0) {
                    emptyState.style.display = 'block';
                } else {
                    tableWrapper.style.display = 'block';
                    updateStats();
                    applyFilters();
                }

            } catch (error) {
                console.error('❌ Erro ao carregar dados:', error);
                loading.innerHTML = `
                    <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #f59e0b; display: block; margin-bottom: 20px;"></i>
                    <p style="color: #f59e0b;">Erro ao carregar dados: ${error.message}</p>
                    <button onclick="loadData()" class="btn btn-primary" style="margin-top: 20px;">
                        <i class="fas fa-sync"></i> Tentar novamente
                    </button>
                `;
                showToast('Erro ao carregar dados: ' + error.message, 'error');
            }
        }

        // Atualizar estatísticas
        function updateStats() {
            const total = allRedirects.length;
            const pending = allRedirects.filter(r => r.status === 'pending').length;
            const redirected = allRedirects.filter(r => r.status === 'redirected').length;
            const cancelled = allRedirects.filter(r => r.status === 'cancelled').length;
            const confirmed = allRedirects.filter(r => r.status === 'confirmed').length;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('redirectedCount').textContent = redirected;
            document.getElementById('cancelledCount').textContent = cancelled;
            document.getElementById('confirmedCount').textContent = confirmed;
        }

        // Aplicar filtros
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const statusFilter = document.getElementById('statusFilter').value;
            const sortFilter = document.getElementById('sortFilter').value;

            // Filtrar
            filteredRedirects = allRedirects.filter(item => {
                // Filtro de status
                if (statusFilter && item.status !== statusFilter) return false;

                // Filtro de busca
                if (searchTerm) {
                    const searchable = [
                        item.targetUrl || '',
                        item.domain || '',
                        item.userId || '',
                        item.userAgent || '',
                        item.referrer || ''
                    ].join(' ').toLowerCase();
                    if (!searchable.includes(searchTerm)) return false;
                }

                return true;
            });

            // Ordenar
            filteredRedirects.sort((a, b) => {
                const dateA = a.timestamp || new Date(0);
                const dateB = b.timestamp || new Date(0);
                if (sortFilter === 'newest') {
                    return dateB - dateA;
                } else {
                    return dateA - dateB;
                }
            });

            // Atualizar página
            currentPage = 1;
            renderTable();
        }

        // Renderizar tabela
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const pagination = document.getElementById('pagination');

            const totalItems = filteredRedirects.length;
            const totalPages = Math.ceil(totalItems / itemsPerPage);

            if (totalItems === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" style="text-align: center; padding: 40px; color: #6b7280;">
                            <i class="fas fa-search" style="font-size: 2rem; display: block; margin-bottom: 10px;"></i>
                            Nenhum redirecionamento encontrado com os filtros atuais
                        </td>
                    </tr>
                `;
                pagination.innerHTML = '';
                return;
            }

            // Paginação
            const start = (currentPage - 1) * itemsPerPage;
            const end = Math.min(start + itemsPerPage, totalItems);
            const pageItems = filteredRedirects.slice(start, end);

            // Renderizar linhas
            tbody.innerHTML = pageItems.map((item, index) => {
                const rowNum = start + index + 1;
                const statusClass = `status-${item.status || 'pending'}`;
                const statusLabel = item.status || 'pending';

                const formattedDate = item.timestamp ?
                    item.timestamp.toLocaleString('pt-BR') :
                    'N/A';

                const domain = item.domain || 'N/A';
                const targetUrl = item.targetUrl || '#';

                return `
                    <tr>
                        <td>${rowNum}</td>
                        <td>
                            <span style="font-size: 0.8rem; font-family: monospace; color: #6b7280;">
                                ${item.userId ? item.userId.substring(0, 12) + '...' : 'N/A'}
                            </span>
                        </td>
                        <td><strong>${domain}</strong></td>
                        <td class="url-cell">
                            <a href="${targetUrl}" target="_blank" title="${targetUrl}">
                                ${targetUrl}
                            </a>
                        </td>
                        <td>
                            <span class="status-badge ${statusClass}">
                                ${statusLabel.charAt(0).toUpperCase() + statusLabel.slice(1)}
                            </span>
                        </td>
                        <td style="font-size: 0.8rem; white-space: nowrap;">
                            ${formattedDate}
                        </td>
                        <td style="font-size: 0.8rem; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                            ${item.referrer || 'Direto'}
                        </td>
                        <td>
                            <div class="actions-cell">
                                <a href="${targetUrl}" target="_blank" class="btn btn-primary btn-sm">
                                    <i class="fas fa-external-link-alt"></i>
                                </a>
                                <button onclick="deleteRedirect('${item.id}')" class="btn btn-danger btn-sm">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            // Paginação
            let paginationHTML = `
                <button onclick="changePage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>
                    <i class="fas fa-chevron-left"></i>
                </button>
            `;

            // Números das páginas
            const maxVisible = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);

            if (endPage - startPage < maxVisible - 1) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }

            for (let i = startPage; i <= endPage; i++) {
                paginationHTML += `
                    <button class="${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">
                        ${i}
                    </button>
                `;
            }

            paginationHTML += `
                <button onclick="changePage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>
                    <i class="fas fa-chevron-right"></i>
                </button>
                <span style="margin-left: 15px; color: #6b7280; font-size: 0.9rem;">
                    ${start + 1} - ${end} de ${totalItems}
                </span>
            `;

            pagination.innerHTML = paginationHTML;
        }

        // Mudar página
        function changePage(page) {
            const totalPages = Math.ceil(filteredRedirects.length / itemsPerPage);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================
        // AÇÕES
        // ============================================================

        // Atualizar dados
        function refreshData() {
            showToast('Atualizando dados...', '');
            loadData();
        }

        // Excluir redirecionamento
        async function deleteRedirect(id) {
            if (!confirm('Tem certeza que deseja excluir este redirecionamento?')) return;

            try {
                await db.collection('redirectwarning').doc(id).delete();
                showToast('✅ Redirecionamento excluído com sucesso!', 'success');
                loadData();
            } catch (error) {
                console.error('Erro ao excluir:', error);
                showToast('❌ Erro ao excluir: ' + error.message, 'error');
            }
        }

        // Limpar todos
        async function clearAll() {
            if (!confirm('⚠️ Tem certeza que deseja EXCLUIR TODOS os redirecionamentos? Esta ação não pode ser desfeita!')) return;

            if (!confirm('Confirme novamente: Excluir TODOS os registros de redirecionamento?')) return;

            try {
                const snapshot = await db.collection('redirectwarning').get();
                const batch = db.batch();

                snapshot.forEach(doc => {
                    batch.delete(doc.ref);
                });

                await batch.commit();
                showToast(`✅ ${snapshot.size} redirecionamentos excluídos com sucesso!`, 'success');
                loadData();
            } catch (error) {
                console.error('Erro ao limpar:', error);
                showToast('❌ Erro ao limpar: ' + error.message, 'error');
            }
        }

        // Exportar CSV
        function exportCSV() {
            if (filteredRedirects.length === 0) {
                showToast('Nenhum dado para exportar', 'error');
                return;
            }

            // Cabeçalhos
            const headers = ['ID', 'Usuário', 'Domínio', 'URL Destino', 'Status', 'Data/Hora', 'Referrer', 'User Agent'];
            const rows = filteredRedirects.map(item => [
                item.id,
                item.userId || '',
                item.domain || '',
                item.targetUrl || '',
                item.status || 'pending',
                item.timestamp ? item.timestamp.toISOString() : '',
                item.referrer || '',
                item.userAgent || ''
            ]);

            const csvContent = [
                headers.join(','),
                ...rows.map(row => row.map(cell => `"${cell}"`).join(','))
            ].join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `redirecionamentos_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);

            showToast(`✅ ${filteredRedirects.length} registros exportados!`, 'success');
        }

        // ============================================================
        // TOAST NOTIFICATION
        // ============================================================

        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');

            toast.className = 'toast ' + type;
            toastMessage.textContent = message;

            toast.classList.add('show');

            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ============================================================
        // INICIAR
        // ============================================================

        document.addEventListener('DOMContentLoaded', loadData);

        // Atualizar a cada 60 segundos (opcional)
        setInterval(() => {
            if (document.hidden) return; // Não atualiza se a página não estiver visível
            loadData();
        }, 60000);
    </script>
</body>
</html>
