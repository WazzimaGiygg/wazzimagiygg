<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - WazzimaGiygg</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
        }
        
        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        .admin-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .admin-card h2 {
            margin-bottom: 20px;
            color: #e94560;
            font-size: 1.5em;
        }
        
        .btn-back {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            padding: 10px 24px;
            border-radius: 30px;
            color: white;
            text-decoration: none;
            margin-bottom: 20px;
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .btn-back:hover {
            background: rgba(255,255,255,0.25);
            transform: scale(1.02);
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .admin-header h1 {
            font-size: 1.8em;
            background: linear-gradient(135deg, #fff, #e94560);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .admin-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .btn-refresh {
            background: linear-gradient(135deg, #17a2b8, #0dcaf0);
        }
        
        .btn-logout {
            background: linear-gradient(135deg, #dc3545, #ff6b6b);
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #28a745, #20c997);
            border: none;
            padding: 14px 30px;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 1.1em;
            transition: all 0.3s;
        }
        
        .btn-submit:hover {
            transform: scale(1.02);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #dc3545, #ff6b6b);
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #ffc107, #ff9800);
            color: #1a1a2e;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            background: rgba(255,255,255,0.9);
            font-size: 1em;
            color: #1a1a2e;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: 2px solid #e94560;
        }
        
        .contributors-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .contributors-table th {
            text-align: left;
            padding: 12px;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            font-weight: 600;
        }
        
        .contributors-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        
        .contributors-table tr:hover {
            background: rgba(255,255,255,0.05);
        }
        
        .btn-delete {
            background: #dc3545;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.3s;
        }
        
        .btn-delete:hover {
            background: #c82333;
            transform: scale(1.05);
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }
        
        .status-confirmed {
            background: #28a745;
            color: white;
        }
        
        .status-pending {
            background: #ffc107;
            color: #1a1a2e;
        }
        
        .login-required {
            text-align: center;
            padding: 40px;
        }
        
        .login-required h2 {
            margin-bottom: 15px;
        }
        
        .login-required p {
            opacity: 0.8;
            margin-bottom: 15px;
        }
        
        .login-required .btn {
            margin: 8px;
            padding: 12px 30px;
        }
        
        .user-info-box {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            text-align: left;
            font-size: 0.9em;
        }
        
        .user-info-box p {
            margin: 5px 0;
        }
        
        .status-message {
            padding: 12px 20px;
            border-radius: 12px;
            margin: 15px 0;
            text-align: center;
        }
        
        .status-success {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
            color: #28a745;
        }
        
        .status-error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
            color: #dc3545;
        }
        
        .status-warning {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid #ffc107;
            color: #ffc107;
        }
        
        .status-info {
            background: rgba(23, 162, 184, 0.2);
            border: 1px solid #17a2b8;
            color: #17a2b8;
        }
        
        .loading-text {
            text-align: center;
            padding: 30px;
            opacity: 0.7;
        }
        
        .total-raised-box {
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.2), rgba(255, 107, 107, 0.2));
            border-radius: 12px;
            padding: 15px 20px;
            margin-top: 15px;
            text-align: center;
            font-size: 1.2em;
        }
        
        .total-raised-box strong {
            color: #ffd700;
        }
        
        .table-responsive {
            overflow-x: auto;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            opacity: 0.6;
        }
        
        @media (max-width: 768px) {
            .admin-container { padding: 15px; }
            .admin-card { padding: 20px; }
            .admin-header { flex-direction: column; align-items: flex-start; }
            .admin-actions { width: 100%; }
            .admin-actions .btn { flex: 1; text-align: center; }
            .contributors-table { font-size: 0.85em; }
            .contributors-table th, .contributors-table td { padding: 8px; }
        }
    </style>
</head>
<body>

<div class="admin-container">
    <a href="index.html" class="btn-back">← Voltar para página principal</a>
    
    <div id="auth-section">
        <!-- Estado: Não autenticado -->
        <div id="login-required" class="login-required admin-card">
            <h2>🔐 Área Restrita</h2>
            <p>Faça login com Google para acessar o painel administrativo</p>
            <button class="btn btn-primary" onclick="loginWithGoogle()" style="font-size: 1.1em; padding: 14px 40px;">
                🔑 Login com Google
            </button>
        </div>

        <!-- Estado: Autenticado -->
        <div id="admin-panel" style="display: none;">
            <div class="admin-header">
                <div>
                    <h1>👑 Painel Administrativo</h1>
                    <p id="admin-user-info" style="opacity: 0.7; margin-top: 5px;"></p>
                </div>
                <div class="admin-actions">
                    <button class="btn btn-refresh" onclick="loadContributors()">🔄 Atualizar</button>
                    <button class="btn btn-logout" onclick="logout()">🚪 Sair</button>
                </div>
            </div>

            <!-- Status Message -->
            <div id="status-message" style="display: none;"></div>

            <!-- Formulário para adicionar contribuição -->
            <div class="admin-card">
                <h2>➕ Adicionar Contribuição</h2>
                <form id="add-contribution-form" onsubmit="addContribution(event)">
                    <div class="form-group">
                        <label>Nome do Contribuidor *</label>
                        <input type="text" id="contributor-name" required placeholder="Ex: João Silva" maxlength="100">
                    </div>
                    <div class="form-group">
                        <label>Email (opcional)</label>
                        <input type="email" id="contributor-email" placeholder="joao@email.com">
                    </div>
                    <div class="form-group">
                        <label>Valor (R$) *</label>
                        <input type="number" id="contributor-amount" required min="0.01" step="0.01" placeholder="Ex: 50.00">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="contributor-status">
                            <option value="confirmed">✅ Confirmado</option>
                            <option value="pending">⏳ Pendente</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit">💾 Salvar Contribuição</button>
                </form>
            </div>

            <!-- Lista de contribuições -->
            <div class="admin-card">
                <h2>📋 Lista de Contribuições</h2>
                
                <!-- Total Arrecadado -->
                <div class="total-raised-box">
                    <strong>💰 Total Arrecadado: </strong>
                    <span id="admin-total-amount">R$ 0,00</span>
                </div>
                
                <div class="table-responsive">
                    <table class="contributors-table">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>Valor</th>
                                <th>Status</th>
                                <th>Data</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="contributors-table-body">
                            <tr>
                                <td colspan="6" class="loading-text">Carregando contribuições...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
// ==============================================================================
// CONFIGURAÇÃO FIREBASE
// ==============================================================================

const firebaseConfig = {
    apiKey: "AIzaSyB9GkSqTIZ0kbVsba_WOdQeVAETrF9qna0",
    authDomain: "wzzm-ce3fc.firebaseapp.com",
    projectId: "wzzm-ce3fc",
    storageBucket: "wzzm-ce3fc.appspot.com",
    messagingSenderId: "249427877153",
    appId: "1:249427877153:web:0e4297294794a5aadeb260"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// ==============================================================================
// VARIÁVEIS GLOBAIS
// ==============================================================================

let currentUser = null;
let isAdminUser = false;

// Lista de emails autorizados (fallback para verificação)
const ADMIN_EMAILS = [
    'seu-email@gmail.com',  // ← SUBSTITUA PELO SEU EMAIL
    'admin@wazzimagiygg.com'
];

// ==============================================================================
// ELEMENTOS DOM
// ==============================================================================

const loginRequired = document.getElementById('login-required');
const adminPanel = document.getElementById('admin-panel');
const adminUserInfo = document.getElementById('admin-user-info');
const statusMessage = document.getElementById('status-message');

// ==============================================================================
// FUNÇÕES DE AUTENTICAÇÃO
// ==============================================================================

function loginWithGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider)
        .then(() => {
            showStatus('✅ Login realizado com sucesso!', 'success');
        })
        .catch(error => {
            showStatus('❌ Erro ao fazer login: ' + error.message, 'error');
            console.error('Erro login:', error);
        });
}

function logout() {
    auth.signOut()
        .then(() => {
            showStatus('👋 Desconectado com sucesso', 'warning');
        })
        .catch(error => {
            showStatus('❌ Erro ao sair: ' + error.message, 'error');
        });
}

function showStatus(message, type = 'info') {
    statusMessage.style.display = 'block';
    statusMessage.textContent = message;
    statusMessage.className = `status-message status-${type}`;
    
    // Ocultar após 5 segundos se for sucesso
    if (type === 'success') {
        setTimeout(() => {
            statusMessage.style.display = 'none';
        }, 5000);
    }
}

// ==============================================================================
// FUNÇÃO PARA CONFIGURAR ADMIN DIRETAMENTE
// ==============================================================================

async function setupAdminDirect() {
    const user = auth.currentUser;
    if (!user) {
        showStatus('❌ Faça login primeiro', 'error');
        return;
    }
    
    if (!confirm(`Deseja tornar "${user.email}" um administrador?\n\nUID: ${user.uid}`)) {
        return;
    }
    
    showStatus('⏳ Configurando administrador...', 'info');
    
    try {
        const docRef = db.collection('users').doc(user.uid);
        const doc = await docRef.get();
        
        if (doc.exists) {
            await docRef.update({
                isAdmin: true,
                isTeatcher: true,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        } else {
            await docRef.set({
                uid: user.uid,
                email: user.email,
                displayName: user.displayName || 'Usuário',
                photoURL: user.photoURL || '',
                isAdmin: true,
                isTeatcher: true,
                isBanned: false,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
        
        showStatus('✅ Configurado como administrador! Recarregando...', 'success');
        
        // Aguardar 1.5s e recarregar
        setTimeout(() => {
            location.reload();
        }, 1500);
        
    } catch (error) {
        console.error('Erro ao configurar admin:', error);
        showStatus('❌ Erro ao configurar admin: ' + error.message, 'error');
    }
}

// ==============================================================================
// VERIFICAÇÃO DE AUTENTICAÇÃO
// ==============================================================================

auth.onAuthStateChanged(async user => {
    currentUser = user;
    
    if (user) {
        const email = user.email;
        const name = user.displayName || email;
        const uid = user.uid;
        
        // Mostrar informações do usuário
        adminUserInfo.innerHTML = `
            👋 Olá, <strong>${escapeHtml(name)}</strong> 
            <span style="opacity:0.5; font-size:0.9em;">(${escapeHtml(email)})</span>
            <br><span style="opacity:0.4; font-size:0.8em;">UID: ${uid}</span>
        `;
        
        try {
            // Verificar no Firestore se é admin
            const userDoc = await db.collection('users').doc(uid).get();
            
            let isFirestoreAdmin = false;
            let userData = {};
            
            if (userDoc.exists) {
                userData = userDoc.data();
                isFirestoreAdmin = userData.isAdmin === true;
            }
            
            // Verificar admin por qualquer uma das condições
            const isSpecificAdmin = uid === "sZxfMuOBPbXdR8nttVPXIN8QOOl1";
            const isEmailAdmin = ADMIN_EMAILS.includes(email);
            
            // Se for admin por qualquer critério
            if (isFirestoreAdmin || isSpecificAdmin || isEmailAdmin) {
                isAdminUser = true;
                loginRequired.style.display = 'none';
                adminPanel.style.display = 'block';
                showStatus('✅ Bem-vindo, Administrador!', 'success');
                loadContributors();
                return;
            }
            
            // Se não for admin, mostrar opção de configurar
            isAdminUser = false;
            loginRequired.style.display = 'block';
            adminPanel.style.display = 'none';
            
            // Mostrar informações detalhadas e opções
            const adminCheckInfo = `
                <div class="user-info-box">
                    <p><strong>👤 Nome:</strong> ${escapeHtml(name)}</p>
                    <p><strong>📧 Email:</strong> ${escapeHtml(email)}</p>
                    <p><strong>🆔 UID:</strong> <code style="background:rgba(255,255,255,0.1);padding:2px 8px;border-radius:4px;font-size:0.85em;">${uid}</code></p>
                    <hr style="border-color:rgba(255,255,255,0.1);margin:10px 0;">
                    <p><strong>📄 Documento no Firestore:</strong> ${userDoc.exists ? '✅ Existe' : '❌ Não existe'}</p>
                    ${userDoc.exists ? `<p><strong>isAdmin:</strong> ${userData.isAdmin === true ? '✅ Sim' : '❌ Não'}</p>` : ''}
                    <p><strong>🔑 Email na lista:</strong> ${isEmailAdmin ? '✅ Sim' : '❌ Não'}</p>
                    <p><strong>⭐ Admin Específico:</strong> ${isSpecificAdmin ? '✅ Sim' : '❌ Não'}</p>
                </div>
                <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:15px;">
                    <button class="btn btn-warning" onclick="setupAdminDirect()" style="font-size:1em;padding:12px 30px;">
                        ⚡ Tornar-me Administrador
                    </button>
                    <button class="btn btn-primary" onclick="loginWithGoogle()" style="font-size:1em;padding:12px 30px;">
                        🔄 Tentar novamente
                    </button>
                    <button class="btn btn-danger" onclick="logout()" style="font-size:1em;padding:12px 30px;">
                        🚪 Sair
                    </button>
                </div>
            `;
            
            document.querySelector('.login-required').innerHTML = `
                <h2>🔐 Área Restrita</h2>
                <p>Olá <strong>${escapeHtml(name)}</strong>, você não tem permissão de administrador.</p>
                ${adminCheckInfo}
            `;
            
            showStatus('⚠️ Você não é administrador. Clique em "Tornar-me Administrador" para obter acesso.', 'warning');
            
        } catch (error) {
            console.error('Erro ao verificar admin:', error);
            showStatus('❌ Erro ao verificar permissões: ' + error.message, 'error');
            loginRequired.style.display = 'block';
            adminPanel.style.display = 'none';
        }
        
    } else {
        // Usuário não autenticado
        isAdminUser = false;
        loginRequired.style.display = 'block';
        adminPanel.style.display = 'none';
        adminUserInfo.textContent = '';
        
        // Restaurar o conteúdo do login
        document.querySelector('.login-required').innerHTML = `
            <h2>🔐 Área Restrita</h2>
            <p>Faça login com Google para acessar o painel administrativo</p>
            <button class="btn btn-primary" onclick="loginWithGoogle()" style="font-size:1.1em;padding:14px 40px;">
                🔑 Login com Google
            </button>
        `;
    }
});

// ==============================================================================
// FUNÇÕES DE CONTRIBUIÇÕES
// ==============================================================================

async function loadContributors() {
    if (!isAdminUser) {
        showStatus('⚠️ Você não tem permissão para carregar contribuições.', 'warning');
        return;
    }
    
    try {
        const snapshot = await db.collection('custos')
            .orderBy('createdAt', 'desc')
            .get();
        
        const tbody = document.getElementById('contributors-table-body');
        
        if (snapshot.empty) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="empty-state">
                        📭 Nenhuma contribuição registrada ainda.
                    </td>
                </tr>
            `;
            document.getElementById('admin-total-amount').textContent = 'R$ 0,00';
            return;
        }
        
        let total = 0;
        let html = '';
        
        snapshot.forEach(doc => {
            const data = doc.data();
            const amount = Number(data.amount) || 0;
            total += amount;
            
            const date = data.createdAt ? 
                new Date(data.createdAt.toDate()).toLocaleString('pt-BR') : 
                'Data não disponível';
            
            const statusClass = data.status === 'confirmed' ? 'status-confirmed' : 'status-pending';
            const statusText = data.status === 'confirmed' ? '✅ Confirmado' : '⏳ Pendente';
            
            html += `
                <tr>
                    <td><strong>${escapeHtml(data.name || 'Anônimo')}</strong></td>
                    <td>${escapeHtml(data.email || '—')}</td>
                    <td><strong style="color: #28a745;">R$ ${amount.toFixed(2)}</strong></td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td style="font-size:0.85em;opacity:0.7;">${date}</td>
                    <td>
                        <button class="btn-delete" onclick="deleteContribution('${doc.id}')" title="Excluir contribuição">
                            🗑️
                        </button>
                    </td>
                </tr>
            `;
        });
        
        tbody.innerHTML = html;
        document.getElementById('admin-total-amount').textContent = `R$ ${total.toFixed(2)}`;
        
        showStatus(`✅ ${snapshot.size} contribuições carregadas. Total: R$ ${total.toFixed(2)}`, 'success');
        
    } catch (error) {
        console.error('Erro ao carregar contribuições:', error);
        document.getElementById('contributors-table-body').innerHTML = `
            <tr>
                <td colspan="6" style="text-align:center;padding:30px;color:#dc3545;">
                    ❌ Erro ao carregar dados: ${escapeHtml(error.message)}
                </td>
            </tr>
        `;
        showStatus('❌ Erro ao carregar contribuições: ' + error.message, 'error');
    }
}

// ==============================================================================
// ADICIONAR CONTRIBUIÇÃO
// ==============================================================================

async function addContribution(event) {
    event.preventDefault();
    
    if (!isAdminUser) {
        showStatus('⚠️ Você não tem permissão para adicionar contribuições.', 'warning');
        return;
    }
    
    const name = document.getElementById('contributor-name').value.trim();
    const email = document.getElementById('contributor-email').value.trim();
    const amount = parseFloat(document.getElementById('contributor-amount').value);
    const status = document.getElementById('contributor-status').value;
    
    if (!name) {
        showStatus('⚠️ Por favor, informe o nome do contribuidor.', 'warning');
        document.getElementById('contributor-name').focus();
        return;
    }
    
    if (!amount || amount <= 0) {
        showStatus('⚠️ Por favor, informe um valor válido maior que zero.', 'warning');
        document.getElementById('contributor-amount').focus();
        return;
    }
    
    showStatus('⏳ Salvando contribuição...', 'info');
    
    try {
        await db.collection('custos').add({
            name: name,
            email: email || '',
            amount: amount,
            status: status,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        showStatus('✅ Contribuição adicionada com sucesso!', 'success');
        document.getElementById('add-contribution-form').reset();
        loadContributors();
        
    } catch (error) {
        console.error('Erro ao adicionar contribuição:', error);
        showStatus('❌ Erro ao salvar: ' + error.message, 'error');
    }
}

// ==============================================================================
// DELETAR CONTRIBUIÇÃO
// ==============================================================================

async function deleteContribution(docId) {
    if (!isAdminUser) {
        showStatus('⚠️ Você não tem permissão para excluir contribuições.', 'warning');
        return;
    }
    
    if (!confirm('⚠️ Tem certeza que deseja excluir esta contribuição?\n\nEsta ação não pode ser desfeita!')) {
        return;
    }
    
    showStatus('⏳ Excluindo contribuição...', 'info');
    
    try {
        await db.collection('custos').doc(docId).delete();
        showStatus('🗑️ Contribuição excluída com sucesso!', 'success');
        loadContributors();
    } catch (error) {
        console.error('Erro ao excluir:', error);
        showStatus('❌ Erro ao excluir: ' + error.message, 'error');
    }
}

// ==============================================================================
// FUNÇÕES AUXILIARES
// ==============================================================================

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ==============================================================================
// EXPOR FUNÇÕES GLOBALMENTE
// ==============================================================================

window.loginWithGoogle = loginWithGoogle;
window.logout = logout;
window.loadContributors = loadContributors;
window.addContribution = addContribution;
window.deleteContribution = deleteContribution;
window.setupAdminDirect = setupAdminDirect;
window.showStatus = showStatus;

// ==============================================================================
// INICIALIZAÇÃO - AUTO ATUALIZAÇÃO
// ==============================================================================

// Atualizar automaticamente a cada 30 segundos se for admin
setInterval(() => {
    if (isAdminUser) {
        loadContributors();
    }
}, 30000);

console.log('🚀 Admin Panel loaded successfully!');
console.log('📌 Para se tornar admin, clique no botão "Tornar-me Administrador"');
