<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Admin - WazzimaGiygg</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            text-align: center;
        }
        h1 { margin-bottom: 20px; color: #e94560; }
        .info { 
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: left;
        }
        .btn {
            background: linear-gradient(135deg, #28a745, #20c997);
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
        }
        .btn-danger {
            background: linear-gradient(135deg, #dc3545, #ff6b6b);
        }
        .btn-warning {
            background: linear-gradient(135deg, #ffc107, #ff9800);
            color: #1a1a2e;
        }
        .status {
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .success { background: rgba(40, 167, 69, 0.3); border: 1px solid #28a745; }
        .error { background: rgba(220, 53, 69, 0.3); border: 1px solid #dc3545; }
        .warning { background: rgba(255, 193, 7, 0.3); border: 1px solid #ffc107; }
        .loading { animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        .user-info {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Configurar Administrador</h1>
        <p>Ferramenta para configurar seu usuário como admin no Firestore</p>
        
        <div id="status-message" class="status warning">⚠️ Faça login para continuar</div>
        
        <div id="user-info" class="user-info" style="display:none;">
            <p><strong>👤 Usuário:</strong> <span id="user-name"></span></p>
            <p><strong>📧 Email:</strong> <span id="user-email"></span></p>
            <p><strong>🆔 UID:</strong> <span id="user-uid"></span></p>
        </div>
        
        <div id="admin-status" style="display:none;"></div>
        
        <button id="login-btn" class="btn" onclick="login()">🔑 Login com Google</button>
        <button id="setup-btn" class="btn" onclick="setupAdmin()" style="display:none;">⭐ Tornar-me Administrador</button>
        <button id="remove-btn" class="btn btn-danger" onclick="removeAdmin()" style="display:none;">❌ Remover Admin</button>
        <button id="check-btn" class="btn btn-warning" onclick="checkAdminStatus()" style="display:none;">🔍 Verificar Status</button>
        <button id="logout-btn" class="btn btn-danger" onclick="logout()" style="display:none;">🚪 Sair</button>
        
        <div style="margin-top: 20px; font-size: 0.8em; opacity: 0.5;">
            <p>Após configurar, volte para a página admin.html</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script>
        // Configuração Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyB9GkSqTIZ0kbVsba_WOdQeVAETrF9qna0",
            authDomain: "wzzm-ce3fc.firebaseapp.com",
            projectId: "wzzm-ce3fc",
            storageBucket: "wzzm-ce3fc.appspot.com",
            messagingSenderId: "249427877153",
            appId: "1:249427877153:web:0e4297294794a5aadeb260"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;

        function showStatus(message, type = 'warning') {
            const el = document.getElementById('status-message');
            el.textContent = message;
            el.className = `status ${type}`;
        }

        function updateUI() {
            const user = auth.currentUser;
            const loginBtn = document.getElementById('login-btn');
            const setupBtn = document.getElementById('setup-btn');
            const removeBtn = document.getElementById('remove-btn');
            const checkBtn = document.getElementById('check-btn');
            const logoutBtn = document.getElementById('logout-btn');
            const userInfo = document.getElementById('user-info');

            if (user) {
                currentUser = user;
                loginBtn.style.display = 'none';
                userInfo.style.display = 'block';
                document.getElementById('user-name').textContent = user.displayName || 'Sem nome';
                document.getElementById('user-email').textContent = user.email;
                document.getElementById('user-uid').textContent = user.uid;
                
                setupBtn.style.display = 'block';
                removeBtn.style.display = 'block';
                checkBtn.style.display = 'block';
                logoutBtn.style.display = 'block';
                
                checkAdminStatus();
            } else {
                currentUser = null;
                loginBtn.style.display = 'block';
                setupBtn.style.display = 'none';
                removeBtn.style.display = 'none';
                checkBtn.style.display = 'none';
                logoutBtn.style.display = 'none';
                userInfo.style.display = 'none';
                document.getElementById('admin-status').style.display = 'none';
                showStatus('⚠️ Faça login para continuar', 'warning');
            }
        }

        async function checkAdminStatus() {
            const user = auth.currentUser;
            if (!user) {
                showStatus('❌ Faça login primeiro', 'error');
                return;
            }

            showStatus('🔍 Verificando status de admin...', 'warning');
            
            try {
                const doc = await db.collection('users').doc(user.uid).get();
                const adminStatus = document.getElementById('admin-status');
                adminStatus.style.display = 'block';
                
                if (doc.exists) {
                    const data = doc.data();
                    const isAdmin = data.isAdmin === true;
                    const isTeatcher = data.isTeatcher === true;
                    const isBanned = data.isBanned === true;
                    
                    adminStatus.innerHTML = `
                        <div class="status ${isAdmin ? 'success' : 'warning'}">
                            <strong>Status Admin:</strong> ${isAdmin ? '✅ É ADMIN' : '❌ Não é Admin'}
                        </div>
                        <div class="status ${isTeatcher ? 'success' : ''}" style="background: rgba(23, 162, 184, 0.3); border: 1px solid #17a2b8; margin-top: 5px;">
                            <strong>Status Teacher:</strong> ${isTeatcher ? '✅ É Teacher' : '❌ Não é Teacher'}
                        </div>
                        <div class="status ${isBanned ? 'error' : 'success'}" style="margin-top: 5px;">
                            <strong>Status Banido:</strong> ${isBanned ? '⚠️ USUÁRIO BANIDO' : '✅ Não está banido'}
                        </div>
                        <div style="margin-top: 10px; font-size: 0.8em; opacity: 0.7;">
                            <strong>Documento:</strong> ${doc.id}
                        </div>
                    `;
                    
                    if (isAdmin) {
                        showStatus('✅ Você é administrador! Pode acessar o admin.html', 'success');
                    } else {
                        showStatus('⚠️ Você NÃO é administrador. Clique em "Tornar-me Administrador"', 'warning');
                    }
                } else {
                    adminStatus.innerHTML = `
                        <div class="status warning">
                            <strong>⚠️ Documento de usuário não encontrado</strong>
                            <p style="margin-top: 10px;">Clique em "Tornar-me Administrador" para criar o documento.</p>
                        </div>
                    `;
                    showStatus('⚠️ Documento de usuário não encontrado', 'warning');
                }
            } catch (error) {
                console.error('Erro ao verificar:', error);
                showStatus('❌ Erro ao verificar: ' + error.message, 'error');
            }
        }

        async function setupAdmin() {
            const user = auth.currentUser;
            if (!user) {
                showStatus('❌ Faça login primeiro', 'error');
                return;
            }

            showStatus('⏳ Configurando administrador...', 'warning');

            try {
                // Verificar se já existe documento
                const docRef = db.collection('users').doc(user.uid);
                const doc = await docRef.get();

                if (doc.exists) {
                    // Atualizar documento existente
                    await docRef.update({
                        isAdmin: true,
                        isTeatcher: true,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    showStatus('✅ Usuário atualizado para ADMIN!', 'success');
                } else {
                    // Criar novo documento
                    await docRef.set({
                        uid: user.uid,
                        email: user.email,
                        displayName: user.displayName || 'Usuário',
                        isAdmin: true,
                        isTeatcher: true,
                        isBanned: false,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    showStatus('✅ Documento criado e usuário configurado como ADMIN!', 'success');
                }

                // Recarregar status
                setTimeout(checkAdminStatus, 1000);

            } catch (error) {
                console.error('Erro ao configurar admin:', error);
                showStatus('❌ Erro: ' + error.message, 'error');
            }
        }

        async function removeAdmin() {
            const user = auth.currentUser;
            if (!user) {
                showStatus('❌ Faça login primeiro', 'error');
                return;
            }

            if (!confirm('Tem certeza que deseja remover seus privilégios de administrador?')) {
                return;
            }

            showStatus('⏳ Removendo privilégios...', 'warning');

            try {
                await db.collection('users').doc(user.uid).update({
                    isAdmin: false,
                    isTeatcher: false,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                showStatus('✅ Privilégios de admin removidos!', 'warning');
                setTimeout(checkAdminStatus, 1000);
                
            } catch (error) {
                console.error('Erro ao remover admin:', error);
                showStatus('❌ Erro: ' + error.message, 'error');
            }
        }

        function login() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(error => {
                showStatus('❌ Erro ao fazer login: ' + error.message, 'error');
            });
        }

        function logout() {
            auth.signOut();
            showStatus('👋 Desconectado', 'warning');
            document.getElementById('admin-status').style.display = 'none';
        }

        // Atualizar UI quando auth mudar
        auth.onAuthStateChanged(user => {
            updateUI();
        });

        // Inicializar
        updateUI();
    </script>
</body>
</html>
