<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MASPIA · Gestão de Soluções e Projetos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .app {
            max-width: 1400px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0, 20, 40, 0.15);
            display: flex;
            flex-direction: column;
            height: 94vh;
            overflow: hidden;
        }
        .header {
            padding: 1.2rem 2rem;
            border-bottom: 1px solid #e2e9f2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem 1.5rem;
            background: #fafcff;
        }
        .header h1 {
            font-weight: 600;
            font-size: 1.8rem;
            color: #0b2a44;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .header h1 small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #4a6f8e;
            margin-left: 0.3rem;
        }
        .toolbar {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar button {
            background: white;
            border: 1px solid #cddae9;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #1d3b5a;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .toolbar button:hover {
            background: #e7edf6;
            border-color: #a0bada;
            transform: scale(1.01);
        }
        .toolbar button.primary {
            background: #1d4e7a;
            border-color: #1d4e7a;
            color: white;
        }
        .toolbar button.primary:hover {
            background: #143a5c;
        }
        .toolbar button.encrypted {
            background: #2d7a4e;
            border-color: #2d7a4e;
            color: white;
        }
        .toolbar button.encrypted:hover {
            background: #1e5a39;
        }
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .tree-panel {
            width: 340px;
            min-width: 240px;
            background: #f8faff;
            border-right: 1px solid #e2e9f2;
            padding: 1.2rem 0.8rem;
            overflow-y: auto;
        }
        .tree-panel h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #5c7b9a;
            padding: 0.4rem 0.8rem;
            margin-bottom: 0.5rem;
        }
        .tree-item {
            padding: 0.4rem 0.8rem 0.4rem 1.8rem;
            margin: 0.1rem 0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: 0.1s;
            position: relative;
            word-break: break-word;
        }
        .tree-item .icon {
            font-size: 1.1rem;
            opacity: 0.7;
            width: 1.4rem;
        }
        .tree-item:hover {
            background: #e2ebf6;
        }
        .tree-item.active {
            background: #d0e1f2;
            font-weight: 500;
            color: #0b2a44;
        }
        .tree-item .badge {
            margin-left: auto;
            font-size: 0.7rem;
            background: #cbdae9;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            color: #1f3f5c;
        }
        .tree-item.level-0 { padding-left: 0.8rem; font-weight: 600; }
        .tree-item.level-1 { padding-left: 2rem; }
        .tree-item.level-2 { padding-left: 3.2rem; }
        .tree-item.level-3 { padding-left: 4.4rem; }
        .tree-item.level-4 { padding-left: 5.6rem; font-size: 0.9rem; }
        .tree-item.level-5 { padding-left: 6.8rem; font-size: 0.85rem; color: #2b4a6a; }

        .content-panel {
            flex: 1;
            padding: 1.8rem 2.2rem;
            overflow-y: auto;
            background: white;
        }
        .content-panel .empty {
            color: #7b96b3;
            font-size: 1.1rem;
            margin-top: 2rem;
            text-align: center;
        }
        .content-panel h2 {
            font-weight: 500;
            font-size: 1.6rem;
            color: #0b2a44;
            margin-bottom: 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .content-panel .sub {
            color: #4d6f8e;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #eef3f9;
            padding-bottom: 0.6rem;
        }
        .line-grid {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin: 1rem 0 1.5rem;
        }
        .line-row {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            background: #f7faff;
            padding: 0.5rem 0.8rem;
            border-radius: 12px;
            border: 1px solid #e9eff6;
        }
        .line-row .id {
            font-weight: 500;
            min-width: 80px;
            color: #1d4e7a;
            font-size: 0.9rem;
        }
        .line-row .desc {
            flex: 1;
            color: #1e2f40;
        }
        .line-row .char-count {
            font-size: 0.7rem;
            color: #5d7f9e;
            background: #e9f0f8;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
        }
        .add-line {
            display: flex;
            gap: 0.8rem;
            margin: 0.8rem 0 1.2rem;
            flex-wrap: wrap;
        }
        .add-line input {
            padding: 0.5rem 1rem;
            border: 1px solid #d3dfec;
            border-radius: 40px;
            font-size: 0.9rem;
            flex: 1 1 180px;
            outline: none;
            transition: 0.1s;
        }
        .add-line input:focus {
            border-color: #1d4e7a;
            box-shadow: 0 0 0 2px rgba(29, 78, 122, 0.2);
        }
        .add-line button {
            background: #1d4e7a;
            border: none;
            color: white;
            padding: 0.5rem 1.4rem;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s;
        }
        .add-line button:hover {
            background: #123a5a;
        }
        .btn-sm {
            background: transparent;
            border: 1px solid #d3dfec;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.75rem;
            cursor: pointer;
            color: #2d4b6a;
            transition: 0.1s;
        }
        .btn-sm:hover {
            background: #e2ebf6;
        }
        .btn-sm.danger {
            color: #b33c3c;
            border-color: #f0d0d0;
        }
        .btn-sm.danger:hover {
            background: #fce8e8;
            border-color: #c55a5a;
        }
        .flex-row {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .hidden {
            display: none !important;
        }
        .file-input-label {
            background: white;
            border: 1px solid #cddae9;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #1d3b5a;
            cursor: pointer;
            transition: 0.15s;
        }
        .file-input-label:hover {
            background: #e7edf6;
        }
        #fileInput {
            display: none;
        }
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1d3b5a;
            color: white;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            font-weight: 500;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
        }
        .item-actions {
            display: flex;
            gap: 0.4rem;
            margin-left: auto;
            flex-shrink: 0;
        }
        .item-actions .btn-sm {
            font-size: 0.7rem;
            padding: 0.1rem 0.5rem;
        }
        .lock-icon {
            font-size: 0.8rem;
            margin-left: 0.3rem;
        }
        @media (max-width: 780px) {
            .tree-panel { width: 200px; min-width: 160px; padding: 0.6rem; }
            .content-panel { padding: 1rem; }
            .header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="header">
        <h1>📋 MASPIA <small>Manager in Solution & Projects</small></h1>
        <div class="toolbar">
            <button class="primary" id="btnNewProject">➕ Novo Projeto</button>
            <button id="btnExport">📦 Exportar .maspia</button>
            <label class="file-input-label" for="fileInput">📂 Importar .maspia</label>
            <input type="file" id="fileInput" accept=".maspia" />
        </div>
    </div>
    <div class="main">
        <div class="tree-panel" id="treePanel">
            <h3>📁 Estrutura</h3>
            <div id="treeContainer"></div>
        </div>
        <div class="content-panel" id="contentPanel">
            <div class="empty">👈 Selecione um item na árvore</div>
        </div>
    </div>
</div>
<div id="toast" class="toast"></div>
<script>
    (function() {
        // ---------- MASPIA CORE ----------
        let data = { projetos: [] };
        let selectedPath = [];

        // ---------- CRIPTOGRAFIA (AES-GCM) ----------
        async function encryptData(plaintext, password) {
            const encoder = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                encoder.encode(password),
                'PBKDF2',
                false,
                ['deriveKey']
            );
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const key = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt']
            );
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encoded = encoder.encode(plaintext);
            const ciphertext = await crypto.subtle.encrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                encoded
            );
            // Combina salt + iv + ciphertext
            const result = new Uint8Array(salt.length + iv.length + ciphertext.byteLength);
            result.set(salt, 0);
            result.set(iv, salt.length);
            result.set(new Uint8Array(ciphertext), salt.length + iv.length);
            return btoa(String.fromCharCode(...result));
        }

        async function decryptData(encryptedBase64, password) {
            try {
                const encrypted = Uint8Array.from(atob(encryptedBase64), c => c.charCodeAt(0));
                const salt = encrypted.slice(0, 16);
                const iv = encrypted.slice(16, 28);
                const ciphertext = encrypted.slice(28);
                const encoder = new TextEncoder();
                const keyMaterial = await crypto.subtle.importKey(
                    'raw',
                    encoder.encode(password),
                    'PBKDF2',
                    false,
                    ['deriveKey']
                );
                const key = await crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
                    keyMaterial,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['decrypt']
                );
                const plaintext = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    ciphertext
                );
                return new TextDecoder().decode(plaintext);
            } catch (e) {
                throw new Error('Senha incorreta ou arquivo corrompido.');
            }
        }

        // ---------- helpers ----------
        function getItemByPath(path) {
            if (!path || path.length === 0) return null;
            let current = { projetos: data.projetos };
            for (let i = 0; i < path.length; i++) {
                const key = path[i];
                if (!current) return null;
                if (i === 0) {
                    if (Array.isArray(current.projetos) && current.projetos[key] !== undefined) {
                        current = current.projetos[key];
                    } else return null;
                } else if (i === 1) {
                    if (current.solucoes && current.solucoes[key] !== undefined) current = current.solucoes[key];
                    else return null;
                } else if (i === 2) {
                    if (current.regras && current.regras[key] !== undefined) current = current.regras[key];
                    else return null;
                } else if (i === 3) {
                    if (current.documentos && current.documentos[key] !== undefined) current = current.documentos[key];
                    else return null;
                } else if (i === 4) {
                    if (current.paginas && current.paginas[key] !== undefined) current = current.paginas[key];
                    else return null;
                } else {
                    return null;
                }
            }
            return current;
        }

        function getNodeType(path) {
            if (!path || path.length === 0) return 'projeto';
            if (path.length === 1) return 'projeto';
            if (path.length === 2) return 'solucao';
            if (path.length === 3) return 'regra';
            if (path.length === 4) return 'documento';
            if (path.length === 5) return 'pagina';
            return 'linha';
        }

        function getChildren(item, type) {
            if (type === 'projeto') return item.solucoes || [];
            if (type === 'solucao') return item.regras || [];
            if (type === 'regra') return item.documentos || [];
            if (type === 'documento') return item.paginas || [];
            if (type === 'pagina') return item.linhas || [];
            return [];
        }

        function getItemName(item, type) {
            if (!item) return '?';
            if (type === 'projeto') return item.nome || 'Projeto';
            if (type === 'solucao') return item.nome || 'Solução';
            if (type === 'regra') return item.nome || 'Regra';
            if (type === 'documento') return item.nome || 'Documento';
            if (type === 'pagina') return item.nome || 'Página';
            return 'Linha';
        }

        // ---------- render tree ----------
        function renderTree() {
            const container = document.getElementById('treeContainer');
            container.innerHTML = '';
            if (!data.projetos || data.projetos.length === 0) {
                container.innerHTML = '<div style="padding:1rem;color:#7b96b3;">Nenhum projeto. Crie um!</div>';
                return;
            }

            function renderNode(item, type, path, level) {
                const div = document.createElement('div');
                const name = getItemName(item, type);
                let icon = '📁';
                if (type === 'projeto') icon = '📋';
                else if (type === 'solucao') icon = '🧩';
                else if (type === 'regra') icon = '⚖️';
                else if (type === 'documento') icon = '📄';
                else if (type === 'pagina') icon = '📑';
                else icon = '•';

                const isActive = selectedPath && path.join(',') === selectedPath.join(',');
                div.className = `tree-item level-${Math.min(level,5)} ${isActive ? 'active' : ''}`;
                
                let actionsHtml = '';
                if (type === 'solucao' || type === 'regra') {
                    actionsHtml = `<span class="item-actions">
                        <button class="btn-sm" data-action="rename" data-path="${JSON.stringify(path)}">✏️</button>
                        <button class="btn-sm danger" data-action="delete" data-path="${JSON.stringify(path)}">🗑️</button>
                    </span>`;
                }

                div.innerHTML = `<span class="icon">${icon}</span> ${name} ${actionsHtml}`;
                div.dataset.path = JSON.stringify(path);
                
                div.addEventListener('click', (e) => {
                    if (e.target.closest('[data-action]')) return;
                    selectedPath = path.slice();
                    renderTree();
                    renderContent();
                });

                container.appendChild(div);

                const renameBtn = div.querySelector('[data-action="rename"]');
                if (renameBtn) {
                    renameBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        handleRename(path);
                    });
                }
                const deleteBtn = div.querySelector('[data-action="delete"]');
                if (deleteBtn) {
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        handleDelete(path);
                    });
                }

                const children = getChildren(item, type);
                if (children && children.length) {
                    const childType = type === 'projeto' ? 'solucao' :
                                    type === 'solucao' ? 'regra' :
                                    type === 'regra' ? 'documento' :
                                    type === 'documento' ? 'pagina' :
                                    type === 'pagina' ? 'linha' : 'linha';
                    children.forEach((child, idx) => {
                        const childPath = path.concat(idx);
                        renderNode(child, childType, childPath, level+1);
                    });
                }
            }

            data.projetos.forEach((proj, idx) => {
                renderNode(proj, 'projeto', [idx], 0);
            });
        }

        // ---------- ações de renomear e excluir ----------
        function handleRename(path) {
            const item = getItemByPath(path);
            if (!item) { showToast('Item não encontrado.'); return; }
            const type = getNodeType(path);
            const currentName = getItemName(item, type);
            const newName = prompt(`Renomear ${type}:`, currentName);
            if (newName === null) return;
            const trimmed = newName.trim();
            if (!trimmed) { showToast('Nome não pode estar vazio.'); return; }
            item.nome = trimmed;
            renderTree();
            renderContent();
            showToast(`✅ ${type} renomeado para "${trimmed}".`);
        }

        function handleDelete(path) {
            const item = getItemByPath(path);
            if (!item) { showToast('Item não encontrado.'); return; }
            const type = getNodeType(path);
            const name = getItemName(item, type);
            if (!confirm(`Tem certeza que deseja excluir ${type} "${name}" e todos os seus filhos?`)) return;

            const parentPath = path.slice(0, -1);
            const lastIdx = path[path.length - 1];
            let parent;
            let listKey;
            
            if (parentPath.length === 0) {
                data.projetos.splice(lastIdx, 1);
                if (selectedPath && selectedPath.length > 0 && selectedPath[0] === lastIdx) {
                    selectedPath = [];
                } else if (selectedPath && selectedPath.length > 0 && selectedPath[0] > lastIdx) {
                    selectedPath[0] = selectedPath[0] - 1;
                }
                renderTree();
                renderContent();
                showToast(`🗑️ Projeto "${name}" removido.`);
                return;
            }

            parent = getItemByPath(parentPath);
            if (!parent) { showToast('Erro ao localizar pai.'); return; }
            
            if (parentPath.length === 1) listKey = 'solucoes';
            else if (parentPath.length === 2) listKey = 'regras';
            else if (parentPath.length === 3) listKey = 'documentos';
            else if (parentPath.length === 4) listKey = 'paginas';
            else { showToast('Não é possível excluir este item.'); return; }

            if (!parent[listKey]) { showToast('Lista não encontrada.'); return; }
            parent[listKey].splice(lastIdx, 1);
            
            if (selectedPath && selectedPath.length === path.length) {
                const sameParent = selectedPath.slice(0, -1).every((v, i) => v === parentPath[i]);
                if (sameParent && selectedPath[selectedPath.length-1] === lastIdx) {
                    selectedPath = parentPath.length > 0 ? parentPath : [];
                } else if (sameParent && selectedPath[selectedPath.length-1] > lastIdx) {
                    selectedPath[selectedPath.length-1] = selectedPath[selectedPath.length-1] - 1;
                }
            }
            
            renderTree();
            renderContent();
            showToast(`🗑️ ${type} "${name}" removido.`);
        }

        // ---------- render content ----------
        function renderContent() {
            const panel = document.getElementById('contentPanel');
            if (!selectedPath || selectedPath.length === 0) {
                panel.innerHTML = `<div class="empty">👈 Selecione um projeto, solução, regra, documento ou página</div>`;
                return;
            }
            const item = getItemByPath(selectedPath);
            if (!item) {
                panel.innerHTML = `<div class="empty">⚠️ Item não encontrado</div>`;
                return;
            }
            const type = getNodeType(selectedPath);
            const name = getItemName(item, type);

            let html = `<h2>${name}</h2><div class="sub">${type.charAt(0).toUpperCase()+type.slice(1)}</div>`;

            if (type === 'pagina' || type === 'documento' || type === 'regra' || type === 'solucao' || type === 'projeto') {
                const children = getChildren(item, type);
                if (children && children.length) {
                    const childType = type === 'projeto' ? 'soluções' :
                                    type === 'solucao' ? 'regras' :
                                    type === 'regra' ? 'documentos' :
                                    type === 'documento' ? 'páginas' : 'linhas';
                    html += `<p style="color:#3f6282;margin:0.2rem 0 0.8rem;">${children.length} ${childType}</p>`;
                } else {
                    html += `<p style="color:#7b96b3;">Sem elementos filhos.</p>`;
                }

                if (type === 'pagina') {
                    const linhas = item.linhas || [];
                    html += `<div class="line-grid">`;
                    linhas.forEach((linha, idx) => {
                        const id = linha.id || `L${idx+1}`;
                        const desc = linha.desc || '';
                        const charCount = (id+desc).length;
                        html += `<div class="line-row">
                            <span class="id">${id}</span>
                            <span class="desc">${desc}</span>
                            <span class="char-count">${charCount} / 16 bits</span>
                            <button class="btn-sm danger" data-action="removeLinha" data-idx="${idx}">✕</button>
                        </div>`;
                    });
                    html += `</div>`;
                    html += `<div class="add-line">
                        <input type="text" id="newLineId" placeholder="Identificação (ex: L1)" maxlength="16" />
                        <input type="text" id="newLineDesc" placeholder="Descrição (máx 16 caracteres)" maxlength="16" />
                        <button id="btnAddLinha">➕ Adicionar linha</button>
                    </div>`;
                    html += `<p style="font-size:0.8rem;color:#5d7f9e;">⚠️ Cada linha (ID + descrição) deve ter no máximo 16 caracteres.</p>`;
                } else {
                    const childTypeMap = {
                        'projeto': 'solução',
                        'solucao': 'regra',
                        'regra': 'documento',
                        'documento': 'página'
                    };
                    const nextType = childTypeMap[type];
                    if (nextType) {
                        html += `<div style="margin-top:1.2rem;display:flex;gap:0.8rem;flex-wrap:wrap;">
                            <input type="text" id="newChildName" placeholder="Nome da ${nextType}" style="padding:0.5rem 1rem;border:1px solid #d3dfec;border-radius:40px;flex:1 1 200px;" />
                            <button class="primary" id="btnAddChild">➕ Adicionar ${nextType}</button>
                        </div>`;
                    }
                }
            } else {
                html += `<div class="empty">Item sem conteúdo editável.</div>`;
            }

            panel.innerHTML = html;

            const btnAddChild = document.getElementById('btnAddChild');
            if (btnAddChild) {
                btnAddChild.addEventListener('click', () => {
                    const input = document.getElementById('newChildName');
                    const name = input.value.trim();
                    if (!name) { showToast('Digite um nome válido.'); return; }
                    const parent = getItemByPath(selectedPath);
                    if (!parent) { showToast('Erro ao localizar pai.'); return; }
                    const type = getNodeType(selectedPath);
                    const childKey = type === 'projeto' ? 'solucoes' :
                                    type === 'solucao' ? 'regras' :
                                    type === 'regra' ? 'documentos' :
                                    type === 'documento' ? 'paginas' : null;
                    if (!childKey) { showToast('Não é possível adicionar aqui.'); return; }
                    if (!parent[childKey]) parent[childKey] = [];
                    const newChild = { nome: name };
                    if (childKey === 'solucoes') newChild.regras = [];
                    else if (childKey === 'regras') newChild.documentos = [];
                    else if (childKey === 'documentos') newChild.paginas = [];
                    else if (childKey === 'paginas') newChild.linhas = [];
                    parent[childKey].push(newChild);
                    input.value = '';
                    renderTree();
                    renderContent();
                    showToast(`✅ ${name} adicionado.`);
                });
            }

            const btnAddLinha = document.getElementById('btnAddLinha');
            if (btnAddLinha) {
                btnAddLinha.addEventListener('click', () => {
                    const idInput = document.getElementById('newLineId');
                    const descInput = document.getElementById('newLineDesc');
                    const id = idInput.value.trim();
                    const desc = descInput.value.trim();
                    if (!id || !desc) { showToast('Preencha ID e descrição.'); return; }
                    if ((id+desc).length > 16) { showToast('ID + descrição devem ter no máximo 16 caracteres.'); return; }
                    const pagina = getItemByPath(selectedPath);
                    if (!pagina || !pagina.linhas) { showToast('Página inválida.'); return; }
                    pagina.linhas.push({ id, desc });
                    idInput.value = '';
                    descInput.value = '';
                    renderTree();
                    renderContent();
                    showToast('✅ Linha adicionada.');
                });
            }

            document.querySelectorAll('[data-action="removeLinha"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(btn.dataset.idx, 10);
                    const pagina = getItemByPath(selectedPath);
                    if (!pagina || !pagina.linhas) return;
                    pagina.linhas.splice(idx, 1);
                    renderTree();
                    renderContent();
                    showToast('🗑️ Linha removida.');
                });
            });
        }

        // ---------- CRUD projects ----------
        function addProject(name) {
            if (!name) name = 'Projeto ' + (data.projetos.length+1);
            const proj = { nome: name, solucoes: [] };
            data.projetos.push(proj);
            selectedPath = [data.projetos.length-1];
            renderTree();
            renderContent();
            showToast(`📋 Projeto "${name}" criado.`);
        }

        // ---------- export / import com criptografia ----------
        async function exportMaspia() {
            const password = prompt('🔐 Digite uma senha para criptografar o arquivo (deixe em branco para salvar sem criptografia):');
            const json = JSON.stringify(data, null, 2);
            let blob;
            
            if (password && password.trim() !== '') {
                try {
                    const encrypted = await encryptData(json, password);
                    blob = new Blob([encrypted], { type: 'text/plain' });
                } catch (e) {
                    showToast('❌ Erro ao criptografar: ' + e.message);
                    return;
                }
            } else {
                blob = new Blob([json], { type: 'application/json' });
            }

            if (window.showSaveFilePicker) {
                const opts = {
                    suggestedName: 'projeto.maspia',
                    types: [{
                        description: 'MASPIA Project',
                        accept: { 'application/octet-stream': ['.maspia'] }
                    }]
                };
                try {
                    const fileHandle = await window.showSaveFilePicker(opts);
                    const writable = await fileHandle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    showToast(password && password.trim() !== '' ? '🔒 Projeto criptografado salvo!' : '📦 Projeto salvo com sucesso!');
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        showToast('❌ Erro ao salvar: ' + err.message);
                    }
                }
            } else {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'projeto.maspia';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
                showToast(password && password.trim() !== '' ? '🔒 Projeto criptografado exportado!' : '📦 Projeto exportado!');
            }
        }

        async function importMaspia(file) {
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const content = e.target.result;
                    let jsonData;
                    
                    // Tenta interpretar como JSON puro
                    try {
                        jsonData = JSON.parse(content);
                        if (jsonData && jsonData.projetos && Array.isArray(jsonData.projetos)) {
                            data = jsonData;
                            selectedPath = [];
                            renderTree();
                            renderContent();
                            showToast('📂 Importação concluída!');
                            return;
                        }
                    } catch (_) {}

                    // Se não for JSON, tenta descriptografar
                    const password = prompt('🔐 Digite a senha para descriptografar o arquivo:');
                    if (password === null) {
                        showToast('❌ Importação cancelada.');
                        return;
                    }
                    if (!password.trim()) {
                        showToast('❌ Senha não pode estar vazia para arquivos criptografados.');
                        return;
                    }

                    try {
                        const decrypted = await decryptData(content.trim(), password);
                        jsonData = JSON.parse(decrypted);
                        if (jsonData && jsonData.projetos && Array.isArray(jsonData.projetos)) {
                            data = jsonData;
                            selectedPath = [];
                            renderTree();
                            renderContent();
                            showToast('🔓 Importação descriptografada com sucesso!');
                        } else {
                            showToast('❌ Estrutura inválida após descriptografia.');
                        }
                    } catch (err) {
                        showToast('❌ ' + err.message);
                    }
                } catch (err) {
                    showToast('❌ Erro ao ler arquivo: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        // ---------- toast ----------
        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 3000);
        }

        // ---------- init ----------
        document.addEventListener('DOMContentLoaded', () => {
            addProject('Projeto Exemplo MASPIA');
            const proj = data.projetos[0];
            proj.solucoes = [
                { nome: 'Sistema de Autenticação', regras: [
                    { nome: 'Regra de Senha', documentos: [
                        { nome: 'Política de Senhas', paginas: [
                            { nome: 'Página 1', linhas: [
                                { id: 'R01', desc: 'Mínimo 8 caracteres' },
                                { id: 'R02', desc: 'Letras e números' }
                            ]}
                        ]}
                    ]}
                ]},
                { nome: 'Banco de Dados', regras: [
                    { nome: 'Normalização', documentos: [
                        { nome: '3FN', paginas: [
                            { nome: 'Página 1', linhas: [
                                { id: 'N01', desc: 'Evitar redundância' }
                            ]}
                        ]}
                    ]}
                ]}
            ];
            selectedPath = [0, 0];
            renderTree();
            renderContent();

            document.getElementById('btnNewProject').addEventListener('click', () => {
                const name = prompt('Nome do novo projeto:');
                if (name !== null) addProject(name.trim() || undefined);
            });

            document.getElementById('btnExport').addEventListener('click', exportMaspia);

            document.getElementById('fileInput').addEventListener('change', (e) => {
                if (e.target.files.length) {
                    importMaspia(e.target.files[0]);
                }
                e.target.value = '';
            });
        });
    })();
</script>
</body>
</html>
