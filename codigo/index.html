<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Codificador: Letras → Números → Soma</title>
<style>
  body { font-family:'Segoe UI',sans-serif; background:#0f0f1a; color:#e0e0e0;
         max-width:820px; margin:auto; padding:30px; }
  h1 { color:#7cf; }
  h2 { color:#9cf; font-size:16px; margin-top:0; }
  input,select { width:100%; box-sizing:border-box; background:#1a1a2e; color:#7cf;
         border:1px solid #333; border-radius:6px; padding:12px; font-family:monospace;
         font-size:15px; margin-top:6px; }
  button { background:#4a4aff; color:#fff; border:none; padding:10px 20px;
           border-radius:6px; cursor:pointer; margin:10px 8px 0 0; font-size:14px; }
  button:hover { background:#6a6aff; }
  .box { background:#1a1a2e; border:1px solid #333; border-radius:8px;
         padding:20px; margin:18px 0; }
  .result { background:#050510; border:1px solid #4a4aff; border-radius:6px;
            padding:15px; font-family:monospace; color:#9f9; font-size:16px;
            word-break:break-all; min-height:24px; }
  .big { font-size:28px; color:#7cf; font-weight:bold; }
  label { color:#aaa; font-size:13px; }
  .step { color:#ff9; font-size:14px; font-family:monospace; }
</style>
</head>
<body>

<h1>🔢 Letras → Números → Soma</h1>
<p>Cada letra vira sua posição no alfabeto (A=1...Z=26). Depois, os números são somados.</p>

<div class="box">
  <label>Palavra ou frase:</label>
  <input id="entrada" value="Adição" placeholder="Ex: Update, Adição, Correção...">

  <label style="display:block;margin-top:12px;">Modo:</label>
  <select id="modo">
    <option value="simples">Soma simples (só o total — irreversível)</option>
    <option value="detalhado">Soma detalhada (mostra cada número + total)</option>
    <option value="mapa">Soma com mapa (reversível — guarda os números)</option>
  </select>

  <div>
    <button onclick="codificar()">⚙️ Codificar</button>
    <button onclick="copiar()">📋 Copiar</button>
  </div>
</div>

<div class="box">
  <h2>Resultado</h2>
  <div id="saida" class="result">—</div>
</div>

<div class="box">
  <h2>Passo a passo</h2>
  <div id="passos" class="step">—</div>
</div>

<script>
/* Tabela: A=1, B=2 ... Z=26 */
function letraParaNumero(ch) {
  const c = ch.toLowerCase();
  const n = c.charCodeAt(0) - 96; // 'a'=97 -> 1
  if (n >= 1 && n <= 26) return n;
  return null;
}

function codificar() {
  const txt = document.getElementById('entrada').value;
  const modo = document.getElementById('modo').value;

  const numeros = [];      // cada número individual
  const letrasValidas = []; // letras correspondentes
  let linhaPassos = '';

  for (const ch of txt) {
    const n = letraParaNumero(ch);
    if (n !== null) {
      numeros.push(n);
      letrasValidas.push(ch.toLowerCase());
      linhaPassos += `${ch.toUpperCase()}(${n}) `;
    } else if (ch === ' ') {
      linhaPassos += `␣ `;
    }
  }

  const soma = numeros.reduce((a, b) => a + b, 0);

  let saida = '';
  if (modo === 'simples') {
    saida = `#${soma}`;
  } else if (modo === 'detalhado') {
    saida = `${numeros.join(' + ')} = ${soma}`;
  } else if (modo === 'mapa') {
    // Guarda os números para permitir decodificar
    saida = `${numeros.join('-')} = ${soma}`;
  }

  document.getElementById('saida').textContent = saida;

  document.getElementById('passos').innerHTML =
    `<div style="margin-bottom:8px;color:#ff9;">${linhaPassos.trim()}</div>` +
    `<div style="color:#7cf;font-size:22px;">Soma total: <b>${soma}</b></div>`;
}

function copiar() {
  navigator.clipboard.writeText(document.getElementById('saida').textContent);
}
</script>

</body>
</html>
